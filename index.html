<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Time Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for better visual feedback and layout */
        body {
            font-family: 'Inter', sans-serif; /* Tailwind's default sans-serif font */
        }
        .input-error {
            border-color: #EF4444; /* red-500 */
            box-shadow: 0 0 0 0.2rem rgba(239, 68, 68, 0.25);
        }
        .input-success {
            border-color: #22C55E; /* green-500 */
            box-shadow: 0 0 0 0.2rem rgba(34, 197, 94, 0.25);
        }
        .output-value {
            font-weight: 600; /* semibold */
            color: #4F46E5; /* indigo-600 */
        }
        /* Ensure labels and inputs are nicely aligned */
        label {
            display: block;
            margin-bottom: 0.25rem; /* mb-1 */
        }
        input[type="number"] {
            width: 100%;
            padding: 0.5rem 0.75rem; /* px-3 py-2 */
            border-width: 1px;
            border-color: #D1D5DB; /* gray-300 */
            border-radius: 0.375rem; /* rounded-md */
            box-shadow: inset 0 1px 2px 0 rgba(0, 0, 0, 0.05); /* shadow-sm */
        }
        input[type="number"]:focus {
            outline: 2px solid transparent;
            outline-offset: 2px;
            border-color: #6366F1; /* indigo-500 */
            box-shadow: 0 0 0 0.2rem rgba(99, 102, 241, 0.25); /* ring-indigo-500 */
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr; /* Single column on small screens */
            gap: 1.5rem; /* gap-6 */
        }
        @media (min-width: 768px) { /* md breakpoint */
            .grid-container {
                grid-template-columns: repeat(2, 1fr); /* Two columns on medium screens and up */
            }
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-6 md:p-8 rounded-lg shadow-xl w-full max-w-2xl">
        <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-6 text-center">Production Time Calculator</h1>

        <form id="productionForm" class="space-y-6">
            <div class="grid-container">
                <div class="space-y-4 p-4 border border-gray-200 rounded-lg">
                    <h2 class="text-lg font-semibold text-gray-700 mb-3">Input Parameters</h2>
                    <div>
                        <label for="rollsPerDoff" class="text-sm font-medium text-gray-700">
                            Rolls per Doff (2-8):
                        </label>
                        <input type="number" id="rollsPerDoff" name="rollsPerDoff" min="2" max="8" step="1" required value="2" class="transition-all duration-150 ease-in-out">
                        <p id="rollsPerDoffValidation" class="mt-1 text-xs text-gray-500"></p>
                    </div>

                    <div>
                        <label for="rollLength" class="text-sm font-medium text-gray-700">
                            Roll Length (feet):
                        </label>
                        <input type="number" id="rollLength" name="rollLength" min="1" step="any" required placeholder="e.g., 1000" class="transition-all duration-150 ease-in-out">
                        <p id="rollLengthValidation" class="mt-1 text-xs text-gray-500"></p>
                    </div>

                    <div>
                        <label for="lineSpeed" class="text-sm font-medium text-gray-700">
                            Line Speed (feet per minute):
                        </label>
                        <input type="number" id="lineSpeed" name="lineSpeed" min="1" step="any" required placeholder="e.g., 500" class="transition-all duration-150 ease-in-out">
                        <p id="lineSpeedValidation" class="mt-1 text-xs text-gray-500"></p>
                    </div>

                    <div>
                        <label for="rollsPerPallet" class="text-sm font-medium text-gray-700">
                            Rolls per Pallet:
                        </label>
                        <input type="number" id="rollsPerPallet" name="rollsPerPallet" min="1" step="1" required placeholder="e.g., 20" class="transition-all duration-150 ease-in-out">
                        <p id="rollsPerPalletValidation" class="mt-1 text-xs text-gray-500"></p>
                    </div>
                </div>

                <div class="space-y-4 p-4 border border-gray-200 rounded-lg bg-indigo-50">
                    <h2 class="text-lg font-semibold text-gray-700 mb-3">Calculated Times</h2>
                    <div class="p-3 bg-white rounded-md shadow-sm">
                        <p class="text-sm font-medium text-gray-600">Doff Time (Roll Length / Line Speed):</p>
                        <p id="doffTimeOutput" class="text-lg output-value">-- min -- sec</p>
                    </div>
                    <div class="p-3 bg-white rounded-md shadow-sm">
                        <p class="text-sm font-medium text-gray-600">Roll Time (Doff Time / Rolls per Doff):</p>
                        <p id="rollTimeOutput" class="text-lg output-value">-- min -- sec</p>
                    </div>
                    <div class="p-3 bg-white rounded-md shadow-sm">
                        <p class="text-sm font-medium text-gray-600">Pallet Time (Doff Time * Rolls per Pallet):</p>
                        <p id="palletTimeOutput" class="text-lg output-value">-- min -- sec</p>
                    </div>
                    <p id="overallValidationMessage" class="mt-2 text-sm text-red-600 font-medium"></p>
                </div>
            </div>
        </form>
    </div>

    <script>
        // Get references to all input and output elements
        const rollsPerDoffInput = document.getElementById('rollsPerDoff');
        const rollLengthInput = document.getElementById('rollLength');
        const lineSpeedInput = document.getElementById('lineSpeed');
        const rollsPerPalletInput = document.getElementById('rollsPerPallet');

        const rollsPerDoffValidationMsg = document.getElementById('rollsPerDoffValidation');
        const rollLengthValidationMsg = document.getElementById('rollLengthValidation');
        const lineSpeedValidationMsg = document.getElementById('lineSpeedValidation');
        const rollsPerPalletValidationMsg = document.getElementById('rollsPerPalletValidation');
        const overallValidationMessage = document.getElementById('overallValidationMessage');

        // Output elements
        const rollTimeOutput = document.getElementById('rollTimeOutput'); // Displays what user defined as "Roll Time"
        const doffTimeOutput = document.getElementById('doffTimeOutput'); // Displays what user defined as "Doff Time"
        const palletTimeOutput = document.getElementById('palletTimeOutput');

        // Helper function to format time in minutes and seconds
        function formatTime(totalMinutes) {
            if (isNaN(totalMinutes) || totalMinutes < 0 || !isFinite(totalMinutes)) { // Added isFinite check
                return "-- min -- sec";
            }
            const minutes = Math.floor(totalMinutes);
            const seconds = Math.round((totalMinutes - minutes) * 60);
            return `${minutes} min ${seconds < 10 ? '0' : ''}${seconds} sec`;
        }

        // Helper function to validate a single input
        function validateSingleInput(inputElement, validationMsgElement, min, max, isInteger = false, name = "Value") {
            inputElement.classList.remove('input-error', 'input-success');
            validationMsgElement.textContent = '';
            validationMsgElement.classList.remove('text-red-500', 'text-green-500');

            const valueStr = inputElement.value;
            if (valueStr === '') {
                validationMsgElement.textContent = `${name} is required.`;
                validationMsgElement.classList.add('text-red-500');
                inputElement.classList.add('input-error');
                return false;
            }

            const value = parseFloat(valueStr);

            if (isNaN(value)) {
                validationMsgElement.textContent = `Please enter a valid number for ${name}.`;
                validationMsgElement.classList.add('text-red-500');
                inputElement.classList.add('input-error');
                return false;
            }

            if (isInteger && !Number.isInteger(value)) {
                validationMsgElement.textContent = `${name} must be a whole number.`;
                validationMsgElement.classList.add('text-red-500');
                inputElement.classList.add('input-error');
                return false;
            }
            
            // Special check for lineSpeed and rollsPerDoff to ensure they are not zero for division
            if ((name === "Line Speed" || name === "Rolls per Doff") && value === 0) {
                 validationMsgElement.textContent = `${name} cannot be zero.`;
                validationMsgElement.classList.add('text-red-500');
                inputElement.classList.add('input-error');
                return false;
            }


            if (min !== null && value < min) {
                validationMsgElement.textContent = `${name} must be at least ${min}.`;
                validationMsgElement.classList.add('text-red-500');
                inputElement.classList.add('input-error');
                return false;
            }

            if (max !== null && value > max) {
                validationMsgElement.textContent = `${name} must be no more than ${max}.`;
                validationMsgElement.classList.add('text-red-500');
                inputElement.classList.add('input-error');
                return false;
            }
            
            // If valid
            inputElement.classList.add('input-success');
            validationMsgElement.textContent = '✓';
            validationMsgElement.classList.add('text-green-500');
            return true;
        }


        // Function to perform all calculations and update the UI
        function calculateAndDisplayTimes() {
            // Validate all inputs before proceeding
            // Note: For rollsPerDoff, min is 2 as per original spec, but for division, it cannot be 0.
            // The validateSingleInput function now has a check for 0 for Line Speed and Rolls per Doff.
            const isRollsPerDoffValid = validateSingleInput(rollsPerDoffInput, rollsPerDoffValidationMsg, parseInt(rollsPerDoffInput.min, 10), parseInt(rollsPerDoffInput.max, 10), true, "Rolls per Doff");
            const isRollLengthValid = validateSingleInput(rollLengthInput, rollLengthValidationMsg, parseFloat(rollLengthInput.min), null, false, "Roll Length");
            const isLineSpeedValid = validateSingleInput(lineSpeedInput, lineSpeedValidationMsg, parseFloat(lineSpeedInput.min), null, false, "Line Speed");
            const isRollsPerPalletValid = validateSingleInput(rollsPerPalletInput, rollsPerPalletValidationMsg, parseInt(rollsPerPalletInput.min, 10), null, true, "Rolls per Pallet");

            if (!isRollsPerDoffValid || !isRollLengthValid || !isLineSpeedValid || !isRollsPerPalletValid) {
                rollTimeOutput.textContent = "-- min -- sec";
                doffTimeOutput.textContent = "-- min -- sec";
                palletTimeOutput.textContent = "-- min -- sec";
                overallValidationMessage.textContent = "Please correct the errors in the input fields.";
                return; // Stop calculation if any input is invalid
            }
            overallValidationMessage.textContent = "";


            // Get values from input fields
            const rollsPerDoff = parseFloat(rollsPerDoffInput.value);
            const rollLength = parseFloat(rollLengthInput.value);
            const lineSpeed = parseFloat(lineSpeedInput.value);
            const rollsPerPallet = parseFloat(rollsPerPalletInput.value);

            // Perform calculations based on USER'S DEFINITIONS:
            // Doff Time = Roll Length / Line Speed
            // Roll Time = Doff Time / Rolls per Doff
            // Pallet Time = Doff Time * Rolls per Pallet

            let calculatedDoffTimeMinutes = 0;
            if (lineSpeed > 0) { // This check is technically redundant due to validation, but good for safety
                calculatedDoffTimeMinutes = rollLength / lineSpeed;
            }

            let calculatedRollTimeMinutes = 0;
            if (rollsPerDoff > 0) { // This check is also redundant due to validation
                calculatedRollTimeMinutes = calculatedDoffTimeMinutes / rollsPerDoff;
            }
            
            const calculatedPalletTimeMinutes = calculatedDoffTimeMinutes * rollsPerPallet;

            // Update the display
            // The 'doffTimeOutput' HTML element will display what the user defined as "Doff Time"
            doffTimeOutput.textContent = formatTime(calculatedDoffTimeMinutes);
            // The 'rollTimeOutput' HTML element will display what the user defined as "Roll Time"
            rollTimeOutput.textContent = formatTime(calculatedRollTimeMinutes);
            palletTimeOutput.textContent = formatTime(calculatedPalletTimeMinutes);
        }

        // Add event listeners to all input fields to recalculate on change
        rollsPerDoffInput.addEventListener('input', calculateAndDisplayTimes);
        rollLengthInput.addEventListener('input', calculateAndDisplayTimes);
        lineSpeedInput.addEventListener('input', calculateAndDisplayTimes);
        rollsPerPalletInput.addEventListener('input', calculateAndDisplayTimes);

        // Initial calculation and validation on page load
        document.addEventListener('DOMContentLoaded', () => {
            validateSingleInput(rollsPerDoffInput, rollsPerDoffValidationMsg, parseInt(rollsPerDoffInput.min, 10), parseInt(rollsPerDoffInput.max, 10), true, "Rolls per Doff");
            validateSingleInput(rollLengthInput, rollLengthValidationMsg, parseFloat(rollLengthInput.min), null, false, "Roll Length");
            validateSingleInput(lineSpeedInput, lineSpeedValidationMsg, parseFloat(lineSpeedInput.min), null, false, "Line Speed");
            validateSingleInput(rollsPerPalletInput, rollsPerPalletValidationMsg, parseInt(rollsPerPalletInput.min, 10), null, true, "Rolls per Pallet");
            calculateAndDisplayTimes(); 
        });

    </script>

</body>
</html>
